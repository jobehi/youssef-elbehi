{{ define "main" }}
<p class="runner"><a href="{{ site.Home.RelPermalink }}">Youssef El Behi</a></p>
<article class="post">
  <header>
    <h1 class="hero">{{ .Title }}</h1>
    <p class="meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" }}</time>
      · {{ .ReadingTime }} min read
    </p>
  </header>
  {{- with partial "cover.html" . }}
  <figure>
    <img src="{{ .RelPermalink }}" width="{{ .Width }}" height="{{ .Height }}" alt="">
  </figure>
  {{- end }}
  <div class="prose">
    {{ .Content }}
  </div>
</article>
<p class="back"><a href="{{ site.Home.RelPermalink }}">← Youssef El Behi</a></p>
{{ end }}
